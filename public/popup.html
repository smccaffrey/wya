<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar Availability</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      width: 450px;
      min-height: 600px;
      max-height: 800px;
      padding: 16px;
      font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace;
      font-size: 12px;
      margin: 0;
      background: #1a1a1a;
      color: #e6e6e6;
      display: flex;
      flex-direction: column;
    }

    h1 {
      font-size: 14px;
      margin: 0 0 12px 0;
      color: #00ff88;
      font-weight: 600;
      letter-spacing: -0.5px;
      text-transform: uppercase;
      border-bottom: 2px solid #00ff88;
      padding-bottom: 6px;
      flex-shrink: 0;
    }

    #status-container {
      flex-shrink: 0;
    }

    #main-content {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    .settings-section {
      background: #252525;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 12px;
      border: 1px solid #333;
      flex-shrink: 0;
    }

    .settings-section h2 {
      font-size: 11px;
      margin: 0 0 10px 0;
      color: #00ff88;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .setting-row {
      margin-bottom: 10px;
    }

    .setting-row:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      margin-bottom: 4px;
      color: #999;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 500;
    }

    input[type="number"],
    input[type="date"],
    input[type="time"] {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #404040;
      border-radius: 3px;
      font-size: 12px;
      background: #1a1a1a;
      color: #e6e6e6;
      font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, monospace;
    }

    input[type="number"]:focus,
    input[type="date"]:focus,
    input[type="time"]:focus {
      outline: none;
      border-color: #00ff88;
      box-shadow: 0 0 0 2px rgba(0, 255, 136, 0.1);
    }

    .checkbox-group {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      padding: 4px 6px;
      background: #1a1a1a;
      border-radius: 3px;
      border: 1px solid #333;
      transition: all 0.15s;
    }

    .checkbox-item:hover {
      border-color: #00ff88;
    }

    .checkbox-item input[type="checkbox"] {
      margin-right: 6px;
      width: 14px;
      height: 14px;
      cursor: pointer;
      accent-color: #00ff88;
    }

    .checkbox-item label {
      margin: 0;
      cursor: pointer;
      color: #ccc;
      font-size: 10px;
      text-transform: none;
      letter-spacing: normal;
    }

    .button-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    button {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 3px;
      font-size: 11px;
      cursor: pointer;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, monospace;
      transition: all 0.15s;
    }

    .btn-primary {
      background: #00ff88;
      color: #1a1a1a;
      border: 2px solid #00ff88;
    }

    .btn-primary:hover:not(:disabled) {
      background: #00dd77;
      border-color: #00dd77;
      transform: translateY(-1px);
      box-shadow: 0 4px 8px rgba(0, 255, 136, 0.2);
    }

    .btn-secondary {
      background: transparent;
      color: #00ff88;
      border: 2px solid #00ff88;
    }

    .btn-secondary:hover:not(:disabled) {
      background: rgba(0, 255, 136, 0.1);
      transform: translateY(-1px);
    }

    .btn-primary:disabled,
    .btn-secondary:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none;
    }

    #availability-output {
      background: #252525;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 12px;
      max-height: 400px;
      overflow-y: auto;
    }

    #availability-output.empty {
      color: #666;
      text-align: center;
      padding: 20px 12px;
      font-style: italic;
      font-size: 11px;
      max-height: none;
    }

    .availability-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .availability-list li {
      padding: 6px 0;
      color: #e6e6e6;
      line-height: 1.5;
      border-bottom: 1px solid #333;
      font-family: 'SF Mono', Monaco, monospace;
      font-size: 11px;
    }

    .availability-list li:last-child {
      border-bottom: none;
    }

    .status-message {
      padding: 8px 12px;
      border-radius: 3px;
      margin-bottom: 10px;
      font-size: 11px;
      border: 1px solid;
      font-family: 'SF Mono', Monaco, monospace;
    }

    .status-message.error {
      background: rgba(255, 50, 50, 0.1);
      color: #ff5555;
      border-color: #ff5555;
    }

    .status-message.success {
      background: rgba(0, 255, 136, 0.1);
      color: #00ff88;
      border-color: #00ff88;
    }

    .status-message.info {
      background: rgba(100, 150, 255, 0.1);
      color: #6496ff;
      border-color: #6496ff;
    }

    .hidden {
      display: none;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
      font-size: 11px;
    }

    .date-range-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #1a1a1a;
    }

    ::-webkit-scrollbar-thumb {
      background: #404040;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #00ff88;
    }
  </style>
</head>
<body>
  <h1>📅 Calendar Availability</h1>

  <div id="status-container"></div>

  <div id="not-calendar-section" class="hidden">
    <div class="status-message info">
      Please open Google Calendar to use this extension.
    </div>
    <button id="open-calendar-button" class="btn-primary">Open Google Calendar</button>
  </div>

  <div id="main-content" class="hidden">
    <div class="settings-section">
      <h2>⚙️ Settings</h2>
      
      <div class="setting-row date-range-row">
        <div>
          <label for="start-date">Start Date</label>
          <input type="date" id="start-date" />
        </div>
        <div>
          <label for="end-date">End Date</label>
          <input type="date" id="end-date" />
        </div>
      </div>

      <div class="setting-row">
        <label for="meeting-length">Minimum Meeting Length (minutes)</label>
        <input type="number" id="meeting-length" min="15" step="15" value="30" />
      </div>

      <div class="setting-row">
        <label for="work-start">Work Day Start</label>
        <input type="time" id="work-start" value="09:00" />
      </div>

      <div class="setting-row">
        <label for="work-end">Work Day End</label>
        <input type="time" id="work-end" value="17:00" />
      </div>

      <div class="setting-row">
        <label>Exclude Days</label>
        <div class="checkbox-group">
          <div class="checkbox-item">
            <input type="checkbox" id="exclude-sunday" value="0" checked>
            <label for="exclude-sunday">Sunday</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="exclude-monday" value="1">
            <label for="exclude-monday">Monday</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="exclude-tuesday" value="2">
            <label for="exclude-tuesday">Tuesday</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="exclude-wednesday" value="3">
            <label for="exclude-wednesday">Wednesday</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="exclude-thursday" value="4">
            <label for="exclude-thursday">Thursday</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="exclude-friday" value="5">
            <label for="exclude-friday">Friday</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="exclude-saturday" value="6" checked>
            <label for="exclude-saturday">Saturday</label>
          </div>
        </div>
      </div>
    </div>

    <div class="button-group">
      <button id="generate-button" class="btn-primary">Generate Availability</button>
      <button id="copy-button" class="btn-secondary" disabled>Copy to Clipboard</button>
    </div>

    <div id="availability-output" class="empty">
      Click "Generate Availability" to see your free time slots
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
